# Regression gate: pre-commit hooks, types and the offline test suite on every push and pull request to main.
# Offline only: no AWS credentials, no model calls, no database.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions pinned to a commit, not a movable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install uv==0.13.6
          uv sync --frozen

      # Same hooks as a local commit: ruff, shell scripts, file checks, secret scan.
      - name: Pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Types
        run: uv run mypy

      - name: Offline tests
        env:
          AWS_DEFAULT_REGION: eu-central-1
        run: uv run pytest -q -rs --cov --cov-report=term-missing
