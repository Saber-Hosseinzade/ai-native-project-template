# Claude PR review: runs the REVIEW.md passes on every pull request to main and posts the findings
# as a PR comment. Findings inform the human reviewer; branch protection still needs a human approval.
# Needs the repository secret ANTHROPIC_API_KEY; without it the job is skipped with a notice.

name: claude-review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Check for API key
        if: env.HAS_KEY != 'true'
        run: echo "::notice::ANTHROPIC_API_KEY is not set; Claude review skipped."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 0  # the review diffs against main
          persist-credentials: false

      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67  # v1.0.286
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: origin/${{ github.base_ref }}

            Review this pull request following REVIEW.md at the repo root. Diff against the base with
            `git diff origin/${{ github.base_ref }}...HEAD`. Read the policy skills and the change's
            spec.md and plan.md as REVIEW.md describes. Do not edit files.
            Post the result as one PR comment with `gh pr comment ${{ github.event.pull_request.number }} --body-file <file>`.
          # The repo defaults to plan mode; review needs no edits but must run git and gh.
          claude_args: >-
            --permission-mode default
            --allowedTools "Read,Grep,Glob,Write(/tmp/**),Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
